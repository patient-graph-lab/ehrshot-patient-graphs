repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: no-data-files
        name: block committing data-shaped files outside results/aggregate/
        entry: >-
          bash -c 'git diff --cached --name-only --diff-filter=A
          | grep -E "\.(parquet|csv|zip|tar\.gz|pkl|npy|npz|pt|feather|arrow|db)$"
          | grep -v "^results/aggregate/" && exit 1 || exit 0'
        language: system
        pass_filenames: false
