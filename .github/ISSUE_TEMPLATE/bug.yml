name: Bug report
description: Something is producing wrong or unexpected output
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal steps to reproduce (against synthetic fixtures, not real data)
    validations:
      required: true
