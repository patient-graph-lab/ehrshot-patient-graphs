name: Experiment
description: Log a planned or completed experiment run — this is your searchable experiment log for the paper
title: "[experiment] "
labels: ["experiment"]
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: What are you testing, and why?
    validations:
      required: true
  - type: input
    id: config
    attributes:
      label: Config file
      description: Path to the config in configs/, if applicable
  - type: textarea
    id: confirm
    attributes:
      label: What would confirm it
  - type: textarea
    id: falsify
    attributes:
      label: What would falsify it
  - type: textarea
    id: result
    attributes:
      label: Result
      description: Fill this in when closing the issue
